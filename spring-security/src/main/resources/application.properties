spring.application.name=spring-security


# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3308/learningsecurity
spring.datasource.username=root
spring.datasource.password=prateek216

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.property.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# Logging Configuration
# ===============================
logging.level.org.springframework=INFO
logging.level.com.myapp=DEBUG

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

